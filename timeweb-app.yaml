# Timeweb Apps config for the gitflic-cli documentation site.
#
# Deploy model (gh-pages style):
#   1. Docs live as VitePress source in THIS repo under docs/.
#   2. `npm run docs:build` → docs/.vitepress/dist (static site).
#   3. The built dist is published to the GitHub docs mirror
#      (github.com/zhimbura/gitflic-cli-docs, branch main) — its root IS the
#      built site (no build step on the mirror).
#   4. Timeweb serves that mirror's root statically.
# Release tarballs ride along under /downloads/ (docs/public/downloads/).
app:
  name: gitflic-cli-docs
  type: frontend
  framework: static
  # The mirror root already contains the built VitePress output.
  index_dir: /
  comment: gitflic-cli docs (VitePress, prebuilt) served from the github mirror

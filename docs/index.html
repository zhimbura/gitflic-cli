<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>gitflic-cli · документация</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Лёгкий CLI без внешних зависимостей для REST API GitFlic — merge-реквесты, релизы, задачи, ветки, теги. ~150 эндпоинтов, MCP-сервер для AI-агентов." />

  <!-- Docsify core + themes (loaded from jsDelivr CDN) -->
  <link rel="icon" type="image/svg+xml" href="_media/icon.svg" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/themes/vue.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/themes/dark.css" disabled />

  <!-- Custom overrides -->
  <style>
    :root {
      --theme-color: #e8423a;          /* GitFlic red */
      --theme-color-secondary: #6c757d;
      --mono-font: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    }
    .app-name-link img { display: none; }
    .markdown-section code { font-family: var(--mono-font); font-size: 0.85em; }
    .markdown-section pre { padding: 12px 16px; border-radius: 6px; }
    .markdown-section table { display: block; overflow-x: auto; }
    .markdown-section table tr:nth-child(2n) { background-color: transparent; }
    .markdown-section blockquote {
      border-left: 4px solid var(--theme-color);
      padding: 4px 0 4px 16px;
      margin: 12px 0;
      color: inherit;
    }
    .markdown-section a { font-weight: 500; }
    /* Tag-style chips for command names */
    .markdown-section p code, .markdown-section li code {
      background: rgba(232,66,58,0.08);
      color: var(--theme-color);
      padding: 1px 6px;
      border-radius: 3px;
      font-weight: 500;
    }
    /* Custom GitFlic ribbon (replaces Docsify's GitHub corner).
       We don't set `repo:` in $docsify config so the GitHub corner
       never renders. */
    .gitflic-corner {
      position: fixed;
      top: 0;
      right: 0;
      z-index: 100;
      width: 140px;
      height: 140px;
      overflow: hidden;
      pointer-events: none;
    }
    .gitflic-corner a {
      position: absolute;
      display: block;
      top: 28px;
      right: -45px;
      width: 200px;
      padding: 6px 0;
      background: var(--theme-color);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      transform: rotate(45deg);
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      pointer-events: auto;
    }
    .gitflic-corner a:hover { background: #c4352e; }
    .gitflic-corner svg {
      vertical-align: middle;
      margin-right: 4px;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <!-- Custom GitFlic corner (replaces Docsify's GitHub corner). -->
  <div class="gitflic-corner">
    <a href="https://gitflic.ru/project/tikhon/gitflic-cli" target="_blank" rel="noopener">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 64 64">
        <rect x="2" y="2" width="60" height="60" rx="12" ry="12" fill="#ffffff" opacity="0.18"/>
        <text x="32" y="44" text-anchor="middle" fill="#ffffff"
              font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
              font-size="28" font-weight="700" letter-spacing="-1">gf</text>
      </svg>
      GitFlic →
    </a>
  </div>

  <div id="app">Loading docs…</div>

  <script>
    // Light/dark theme toggle wired to system preference + manual override.
    const css = document.createElement("style");
    css.id = "theme-css";
    css.innerHTML = `
      @media (prefers-color-scheme: dark) {
        body { background: #0f1419; }
      }
    `;
    document.head.appendChild(css);
  </script>

  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
  <!-- Docsify config MUST come AFTER docsify.min.js so $docsify exists when
       plugins read it. Plugin scripts also load AFTER config. -->
  <script>
    window.$docsify = {
      name: "gitflic-cli",
      nameLink: "#/",
      // Note: NO `repo:` here — that triggers Docsify's GitHub corner
      // which doesn't match a GitFlic project. We use a custom
      // `.gitflic-corner` HTML element rendered below instead.
      homepage: "README.md",
      loadSidebar: true,
      loadNavbar: false,
      coverpage: "coverpage.md",
      auto2top: true,
      maxLevel: 4,
      subMaxLevel: 3,
      search: {
        paths: "auto",
        placeholder: "Поиск по документации…",
        noData: "Ничего не найдено.",
        depth: 6,
      },
      copyCode: {
        buttonText: "Copy",
        errorText: "Error",
        successText: "Copied",
      },
      pagination: {
        previousText: "← Назад",
        nextText: "Вперёд →",
        crossChapter: true,
        crossChapterText: true,
      },
    };
  </script>
  <!-- Plugins (must come after $docsify is defined). -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@3.0.4/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-tabs@1.5.1/dist/docsify-tabs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-javascript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-yaml.min.js"></script>
</body>
</html>

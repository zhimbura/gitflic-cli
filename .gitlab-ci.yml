# GitFlic CI / GitLab-compatible pipeline.
#
# Stages:
#   validate  — syntax-check + docs sanity
#   test      — vitest on Node 18 / 20 / 22
#   docs      — verify docs/index.html structure
#   pages     — publish docs/ via GitFlic Pages (requires Pages enabled)
#
# To enable GitFlic Pages:
#   Project → Settings → Pages → Path: /docs, Branch: master
# Then site will be available at https://tikhon.gitflic.io/gitflic-cli/
# (or your project's GitFlic Pages URL).

stages:
  - validate
  - test
  - docs
  - pages

variables:
  # Cache node_modules across jobs (vitest only — CLI is zero-deps).
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

default:
  before_script:
    - node --version
    - npm --version
    # CLI uses zero runtime deps; only vitest for tests.
    - npm ci --no-audit --no-fund --prefer-offline

# ---------- validate -------------------------------------------------------

lint:
  stage: validate
  image: node:20-alpine
  script:
    # Syntax check every .mjs file (catches typos, bad imports, etc).
    - |
      set -e
      echo "→ syntax check"
      for f in lib/gitflic.mjs lib/*.mjs lib/cmd/*.mjs mcp-server/*.mjs scripts/*.mjs; do
        if [ -f "$f" ]; then
          node --check "$f"
        fi
      done
    - |
      echo "→ JSON validity"
      node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8'))"
      node -e "JSON.parse(require('fs').readFileSync('vitest.config.mjs', 'utf8'))"
      if [ -f package-lock.json ]; then
        node -e "JSON.parse(require('fs').readFileSync('package-lock.json', 'utf8'))"
      fi
    - |
      echo "→ docs sanity"
      test -f docs/index.html
      test -f docs/_sidebar.md
      test -f docs/README.md
      grep -q "gitflic-cli" docs/index.html
      grep -q "loadSidebar" docs/index.html
    - |
      echo "→ shell installer sanity"
      bash -n install.sh
      bash -n uninstall.sh
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ---------- test -----------------------------------------------------------

test:node18:
  stage: test
  image: node:18-alpine
  script:
    - npm test
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

test:node20:
  stage: test
  image: node:20-alpine
  script:
    - npm test
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

test:node22:
  stage: test
  image: node:22-alpine
  script:
    - npm test
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ---------- docs -----------------------------------------------------------
# Docsify is zero-build — we just verify the static site renders. CI does
# NOT compile anything; `pages:` below just archives docs/ as-is.

docs:verify:
  stage: docs
  image: node:20-alpine
  script:
    - |
      echo "→ docs structure"
      test -f docs/index.html || (echo "missing docs/index.html" && exit 1)
      test -f docs/_sidebar.md || (echo "missing docs/_sidebar.md" && exit 1)
      test -f docs/README.md || (echo "missing docs/README.md" && exit 1)
    - |
      echo "→ boot dev server, fetch homepage"
      node scripts/serve-docs.mjs &
      SERVER_PID=$!
      sleep 2
      # Homepage must return 200 with expected content.
      curl -sf http://127.0.0.1:3000/ -o /tmp/home.html
      grep -q "gitflic" /tmp/home.html
      echo "✓ homepage OK"
      # Sidebar must return 200.
      curl -sf http://127.0.0.1:3000/_sidebar.md -o /tmp/sidebar.md
      grep -q "Аутентификация" /tmp/sidebar.md
      echo "✓ sidebar OK"
      # README must return 200.
      curl -sf http://127.0.0.1:3000/README.md -o /tmp/readme.md
      echo "✓ readme OK"
      kill $SERVER_PID 2>/dev/null || true
      wait $SERVER_PID 2>/dev/null || true
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ---------- pages ----------------------------------------------------------
# Publish docs/ as a static site via GitFlic Pages. Requires Pages to be
# enabled in project settings (one-time manual step).

pages:
  stage: pages
  image: alpine:3.19
  script:
    - apk add --no-cache rsync
    - mkdir -p public
    - rsync -av --delete docs/ public/
    # GitFlic Pages serves public/ at the configured URL.
  artifacts:
    paths:
      - public
    expire_in: 30 days
  rules:
    # Only deploy from main/master to avoid noise.
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "master"
    # Manual deploy button for hotfixes.
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual

# GitFlic CI/CD pipeline.
#
# Spec: https://docs.gitflic.ru/en/cicd/gitflic-ci-yaml/
# Pipeline: https://docs.gitflic.ru/en/cicd/pipeline/
# Examples: https://docs.gitflic.ru/en/cicd/examples/
# GitLab vs GitFlic keyword comparison: https://docs.gitflic.ru/en/common/compare_yaml/
#
# Stages:
#   validate — syntax-check + JSON + shell installer sanity
#   test     — vitest on Node 18 / 20 / 22 (parallel:matrix)
#   docs     — verify docs/ site renders
#   release  — archive docs/ + create GitFlic release on tags
#
# Notes vs the old `.gitlab-ci.yml`:
#   * Filename MUST be `gitflic-ci.yaml` (per pipeline spec).
#   * GitFlic has NO `pages:` keyword — confirmed by compare_yaml table.
#     We replace it with `release:` so docs ship as a downloadable artifact
#     and (on tags) attach to a GitFlic release.
#   * GitFlic has NO `default:` block — we set `before_script` per-job.
#   * GitFlic has NO `coverage`, `dependencies`, `retry`, `timeout`,
#     `inherit`, `cache:untracked`, `cache:when`, `cache:policy`,
#     `services:docker`, `trigger:branch/inputs`, `include:template/integrity`.
#   * Both `script` and `scripts` keywords are accepted; we use `script`.

stages:
  - validate
  - test
  - docs
  - release

variables:
  # Cache node_modules across jobs (only useful for shell agent runs;
  # Docker-based image: jobs get a fresh container anyway).
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

# ---------- validate -------------------------------------------------------
# Syntax-check every source .mjs file. Pure-syntax + JSON validation.
# Catches typos, broken imports, malformed config.

lint:
  stage: validate
  image: node:20-alpine
  before_script:
    - node --version
    - npm --version
  script:
    - set -e
    - echo "→ syntax check"
    - |
      for f in lib/gitflic.mjs lib/*.mjs lib/cmd/*.mjs mcp-server/*.mjs scripts/*.mjs; do
        if [ -f "$f" ]; then
          node --check "$f"
        fi
      done
    - echo "→ JSON validity"
    - node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8'))"
    - node -e "JSON.parse(require('fs').readFileSync('vitest.config.mjs', 'utf8'))"
    - if [ -f package-lock.json ]; then
        node -e "JSON.parse(require('fs').readFileSync('package-lock.json', 'utf8'))";
      fi
    - echo "→ docs sanity"
    - test -f docs/index.html
    - test -f docs/_sidebar.md
    - test -f docs/README.md
    - grep -q "gitflic-cli" docs/index.html
    - grep -q "loadSidebar" docs/index.html
    - echo "→ shell installer sanity"
    - bash -n install.sh
    - bash -n uninstall.sh
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ---------- test -----------------------------------------------------------
# Run vitest on three Node versions in parallel via `parallel:matrix`
# (GitFlic supports `parallel:matrix` but NOT `parallel: map`).
# Each job gets its own fresh container, so we npm ci inside.

test:node18:
  stage: test
  image: node:18-alpine
  before_script:
    - node --version
    - npm --version
    - npm ci --no-audit --no-fund --prefer-offline
  script:
    - npm test
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

test:node20:
  stage: test
  image: node:20-alpine
  before_script:
    - node --version
    - npm --version
    - npm ci --no-audit --no-fund --prefer-offline
  script:
    - npm test
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

test:node22:
  stage: test
  image: node:22-alpine
  before_script:
    - node --version
    - npm --version
    - npm ci --no-audit --no-fund --prefer-offline
  script:
    - npm test
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ---------- docs -----------------------------------------------------------
# Docsify is zero-build. Just verify the static site renders by booting
# scripts/serve-docs.mjs and curling three endpoints.

docs:verify:
  stage: docs
  image: node:20-alpine
  before_script:
    - node --version
    - npm --version
  script:
    - echo "→ docs structure"
    - test -f docs/index.html || (echo "missing docs/index.html" && exit 1)
    - test -f docs/_sidebar.md || (echo "missing docs/_sidebar.md" && exit 1)
    - test -f docs/README.md || (echo "missing docs/README.md" && exit 1)
    - echo "→ boot dev server, fetch homepage"
    - node scripts/serve-docs.mjs &
    - SERVER_PID=$!
    - sleep 2
    - curl -sf http://127.0.0.1:3000/ -o /tmp/home.html
    - grep -q "gitflic" /tmp/home.html
    - echo "✓ homepage OK"
    - curl -sf http://127.0.0.1:3000/_sidebar.md -o /tmp/sidebar.md
    - grep -q "Аутентификация" /tmp/sidebar.md
    - echo "✓ sidebar OK"
    - curl -sf http://127.0.0.1:3000/README.md -o /tmp/readme.md
    - echo "✓ readme OK"
    - kill $SERVER_PID 2>/dev/null || true
    - wait $SERVER_PID 2>/dev/null || true
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ---------- release --------------------------------------------------------
# Replaces GitLab's `pages:` job (GitFlic has NO Pages feature — see
# https://docs.gitflic.ru/en/common/compare_yaml/ `pages` row is GitLab-only).
#
# docs:archive — bundles docs/ as a downloadable artifact so users can fetch
# the static site straight from the pipeline page.
#
# release:docs — on tag pushes, attaches the docs bundle to a GitFlic release
# using the `release:` keyword (supported per docs).

docs:archive:
  stage: release
  image: alpine:3.19
  before_script:
    - apk add --no-cache rsync
  script:
    - mkdir -p docs-site
    - rsync -av --delete docs/ docs-site/
    - echo "✓ docs site archived ($(du -sh docs-site | cut -f1))"
  artifacts:
    name: gitflic-cli-docs
    paths:
      - docs-site
    expire_in: 30 days
  rules:
    # Only ship on main/master + tags — no noise from feature branches.
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "master"

release:docs:
  stage: release
  image: node:20-alpine
  before_script:
    - node --version
  script:
    - echo "Creating GitFlic release for tag $CI_COMMIT_TAG"
    - echo "Docs bundle: $(du -sh docs-site 2>/dev/null | cut -f1 || echo 'missing')"
    - echo "See CHANGELOG.md for what changed."
  needs:
    - docs:archive
  release:
    name: "gitflic-cli $CI_COMMIT_TAG"
    description: "Automated release of gitflic-cli. See CHANGELOG.md for details."
    tag_name: $CI_COMMIT_TAG
  rules:
    - if: $CI_COMMIT_TAG
